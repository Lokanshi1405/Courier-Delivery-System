<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourierPro | Professional Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary-red: #3B060A; --accent-yellow: #FFF287; }
        .card-header { background-color: var(--primary-red) !important; color: white; }
        .fee-container { background: #f8f9fa; border: 2px dashed #dee2e6; border-radius: 10px; }
        .fee-amount { font-size: 2rem; color: #198754; font-weight: 800; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-9 col-lg-8">
                <div class="card shadow-lg border-0">
                    <div class="card-header p-4">
                        <h3 class="mb-0 text-center fw-bold">Shipment Registration</h3>
                        <p class="text-center mb-0 small opacity-75">Fill details to calculate delivery fare</p>
                    </div>
                    <div class="card-body p-4 p-md-5">
                        <form id="bookingForm" onsubmit="saveAndContinue(event)">
                            
                            <div class="row mb-4">
                                <h6 class="fw-bold text-uppercase text-primary mb-3"><i class="bi bi-person-up"></i> 1. Sender (Pickup)</h6>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small fw-bold">Full Name</label>
                                    <input type="text" name="sender_name" class="form-control" placeholder="John Doe" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small fw-bold">Phone Number</label>
                                    <input type="tel" name="sender_phone" class="form-control" placeholder="10-digit mobile" required>
                                </div>
                                <div class="col-12 mb-3">
                                    <label class="form-label small fw-bold">Pickup Address</label>
                                    <textarea name="sender_address" class="form-control" rows="2" placeholder="Street, Area, Pincode" required></textarea>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <h6 class="fw-bold text-uppercase text-primary mb-3">2. Receiver (Delivery)</h6>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small fw-bold">Receiver Name</label>
                                    <input type="text" name="receiver_name" class="form-control" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label small fw-bold">Receiver Phone</label>
                                    <input type="tel" name="receiver_phone" class="form-control" required>
                                </div>
                                <div class="col-12 mb-3">
                                    <label class="form-label small fw-bold">Delivery Address</label>
                                    <textarea name="receiver_address" class="form-control" rows="2" required></textarea>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <h6 class="fw-bold text-uppercase text-primary mb-3">3. Product & Distance</h6>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label small fw-bold">Product Type</label>
                                    <select name="product_type" class="form-select">
                                        <option value="Document">Document</option>
                                        <option value="Electronics">Machine/Electronics</option>
                                        <option value="Food">Food Item</option>
                                        <option value="Clothing">Clothing/Textile</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label small fw-bold">Weight (kg)</label>
                                    <input type="number" step="0.1" id="weight" name="product_weight" class="form-control" value="1.0" min="0.1" oninput="calculateFee()">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label small fw-bold">Distance (km)</label>
                                    <input type="number" id="distance" name="distance" class="form-control" value="10" min="1" oninput="calculateFee()">
                                </div>
                            </div>

                            <div class="fee-container p-4 text-center mb-4">
                                <span class="text-muted d-block small text-uppercase fw-bold">Calculated Delivery Fee</span>
                                <div class="fee-amount mt-1">&#8377; <span id="displayFee">190</span></div>
                                <input type="hidden" name="amount" id="totalAmount" value="190">
                            </div>
                            
                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow-sm py-3">
                                Proceed to Secure Payment &rarr;
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function calculateFee() {
            const weight = parseFloat(document.getElementById('weight').value) || 0;
            const distance = parseFloat(document.getElementById('distance').value) || 0;

            // Advanced Pricing Logic:
            // Base: 50 | Weight: 30/kg | Distance: 10/km
            if (weight > 0 && distance > 0) {
                const total = Math.round(50 + (weight * 10) + (distance * 3));
                
                document.getElementById('displayFee').innerText = total;
                document.getElementById('totalAmount').value = total;
            }
        }

        function saveAndContinue(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            const data = Object.fromEntries(formData.entries());
            
            // Critical: Ensures data is saved for payment.html to read
            localStorage.setItem('bookingData', JSON.stringify(data));
            window.location.href = 'payment.html';
        }
        
        // Run once on load to set initial price
        calculateFee();
    </script>
</body>
</html>
