<!DOCTYPE html>
<html>
<head>
    <title>CourierPro | Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center" style="height: 100vh;">
    <div class="card mx-auto shadow" style="width: 400px; border-radius: 15px;">
        <div class="card-body p-4 text-center">
            <h3 class="fw-bold mb-4">Admin Portal</h3>
            <form action="AdminLogin" method="POST">
                <input type="text" name="username" class="form-control mb-3" placeholder="Username" required>
                <input type="password" name="password" class="form-control mb-3" placeholder="Password" required>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
