<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Login | CourierPro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background: #f4f7f6; font-family: 'Inter', sans-serif; }
        .login-card { border: none; border-radius: 15px; max-width: 400px; width: 100%; }
        .btn-primary { background: #0d6efd; border: none; padding: 12px; }
    </style>
</head>
<body class="d-flex align-items-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card login-card shadow-lg p-4 mx-auto">
                <div class="text-center mb-4">
                    <h2 class="fw-bold">User Login</h2>
                    <p class="text-muted small">Access your shipping dashboard</p>
                </div>

                <script>
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.has('error')) {
                        document.write('<div class="alert alert-danger py-2 small text-center">Invalid Username or Password</div>');
                    }
                </script>

                <form action="UserLogin" method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
                            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
                            <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between mb-4">
                        <div class="form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label small" for="remember">Remember me</label>
                        </div>
                        <a href="forgot_password.html" class="small text-decoration-none">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">Login</button>
                </form>

                <div class="mt-4 text-center border-top pt-3">
                    <p class="small text-muted">New here? <a href="register.html" class="text-decoration-none fw-bold">Create Account</a></p>
                    <a href="index.html" class="btn btn-link btn-sm text-secondary text-decoration-none mt-2">
                        <i class="bi bi-arrow-left"></i> Back to Home
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
